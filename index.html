<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quote-card">

        <p class="label">Quote of the Day</p>

        <blockquote>
            “The only way to do great work is to love what you do.”
        </blockquote>

        <p class="author">— Steve Jobs</p>

        <a href="https://www.goodreads.com/quotes" class="more-quotes">More Quotes</a>

    </main>

</body>
</html>
